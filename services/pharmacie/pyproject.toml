[project]
name = "lafia-pharmacie"
version = "0.1.0"
description = "Service pharmacie : lignes payées à délivrer, allergies, traitements au long cours, délivrances."
requires-python = ">=3.11"
dependencies = [
    "lafia-commun",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.54,<0.55",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmacie"]
