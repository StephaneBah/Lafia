[project]
name = "lafia-commun"
version = "0.1.0"
description = "Bibliothèque partagée par les services Lafia, intégrée à chaque image à la construction."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commun"]
