[project]
name = "lafia-numerisation"
version = "0.1.0"
description = "Service numerisation : le guichet qui numérise les papiers médicaux d'un citoyen en Documents de son dossier."
requires-python = ">=3.11"
dependencies = [
    "lafia-commun",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.54,<0.55",
    # Les pages arrivent en multipart/form-data.
    "python-multipart>=0.0.20,<0.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numerisation"]
