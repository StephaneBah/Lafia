# Pile Lafia : passerelle, noyau FHIR, services, applications.
#
# Démarrage, depuis un clone neuf :   docker compose up -d --build --wait
#
# Les valeurs par défaut ci-dessous servent au développement local seulement.
# En production, chaque variable de .env.example est fixée dans .env (ignoré par git).
# Le mot de passe s'écrit ${VAR-défaut} : absent, il prend la valeur locale ; laissé vide
# dans un .env copié sans être rempli, il reste vide et la base refuse de démarrer.
#
# Trois réseaux rendent les invariants physiques :
# - passerelle : Caddy, les services et les applications. Caddy est le seul conteneur qui publie des ports.
# - noyau : HAPI, sa base, le chargement du jeu de démonstration, et les services qui parlent FHIR
#   (pas identite). Réseau interne, sans sortie. Les applications n'y sont jamais : elles ne peuvent
#   pas joindre le noyau, même par erreur.
# - identite : identite et sa base, rien d'autre. Réseau interne : aucune application, aucun service
#   qui parle FHIR ne joint les comptes.
#
# Remise à zéro complète, noyau et comptes vidés puis rechargés du seul jeu de démonstration :
#   docker compose down -v && docker compose up -d --build --wait

name: lafia

# Les bibliothèques du dépôt, contextes nommés de la construction de chaque service (services/Dockerfile).
x-bibliotheques: &bibliotheques
  commun: commun
  donnees: donnees

# Un service qui parle FHIR : sur les deux réseaux, démarré quand le noyau répond et que le jeu de
# démonstration y est chargé. Il vérifie seul les jetons signés par identite, par la clé publique
# JETON_CLE_PUBLIQUE ; vide, sur localhost seulement, il prend la clé de développement ; sur tout
# autre domaine, il refuse de démarrer.
x-service-fhir: &service-fhir
  restart: unless-stopped
  depends_on:
    noyau:
      condition: service_healthy
    # Attendre la fin du chargement lui donne aussi sa place dans `up --wait`, qui sinon prendrait
    # son arrêt pour une panne.
    chargement:
      condition: service_completed_successfully
  environment:
    NOYAU_URL: http://noyau:8080/fhir
    JETON_CLE_PUBLIQUE: ${JETON_CLE_PUBLIQUE:-}
    LAFIA_DOMAINE: ${LAFIA_DOMAINE:-localhost}
  networks:
    - passerelle
    - noyau
  mem_limit: 256m

# L'application d'un acteur : sur le réseau passerelle seulement ; elle joint son service par la
# passerelle, à l'entrée interne de son sous-domaine (PASSERELLE_URL).
x-application: &application
  restart: unless-stopped
  depends_on:
    - passerelle
  networks:
    - passerelle
  mem_limit: 256m

services:
  passerelle:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LAFIA_DOMAINE: ${LAFIA_DOMAINE:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - passerelle-donnees:/data
      - passerelle-config:/config
    networks:
      passerelle:
        # Sur le réseau passerelle, chaque sous-domaine désigne la passerelle : le serveur d'une
        # application joint son entrée interne sous son propre nom (voir le Caddyfile).
        aliases:
          - soin.${LAFIA_DOMAINE:-localhost}
          - caisse.${LAFIA_DOMAINE:-localhost}
          - pharmacie.${LAFIA_DOMAINE:-localhost}
          - citoyen.${LAFIA_DOMAINE:-localhost}
    mem_limit: 128m

  base-noyau:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: noyau
      POSTGRES_USER: noyau
      POSTGRES_PASSWORD: ${NOYAU_BASE_MOT_DE_PASSE-noyau-local}
    volumes:
      - noyau-donnees:/var/lib/postgresql/data
    networks:
      - noyau
    healthcheck:
      test: ["CMD", "pg_isready", "--username=noyau", "--dbname=noyau"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  # HAPI FHIR R4 en configuration par défaut : seule la base est changée, par l'environnement.
  noyau:
    image: hapiproject/hapi:v8.12.0-1
    restart: unless-stopped
    depends_on:
      base-noyau:
        condition: service_healthy
    environment:
      spring.datasource.url: jdbc:postgresql://base-noyau:5432/noyau
      spring.datasource.username: noyau
      spring.datasource.password: ${NOYAU_BASE_MOT_DE_PASSE-noyau-local}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      JAVA_TOOL_OPTIONS: -Xmx1g
    networks:
      - noyau
    healthcheck:
      # Sonde livrée dans l'image officielle (distroless, sans shell) : santé Spring, base comprise.
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app", "HealthCheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 5m
      start_interval: 5s
    mem_limit: 2g

  # Écrit le jeu de démonstration (donnees/) dans le noyau à chaque `up`, puis s'arrête. Il ne
  # supprime rien : un redéploiement garde ce que les utilisateurs ont créé.
  chargement:
    build:
      context: donnees
      additional_contexts:
        commun: commun
    image: lafia/chargement
    depends_on:
      noyau:
        condition: service_healthy
    environment:
      NOYAU_URL: http://noyau:8080/fhir
    networks:
      - noyau
    mem_limit: 128m

  # Chaque service est construit par services/Dockerfile, commun compris.
  soin:
    <<: *service-fhir
    build:
      context: services
      additional_contexts: *bibliotheques
      args:
        SERVICE: soin
    image: lafia/soin

  caisse:
    <<: *service-fhir
    build:
      context: services
      additional_contexts: *bibliotheques
      args:
        SERVICE: caisse
    image: lafia/caisse

  pharmacie:
    <<: *service-fhir
    build:
      context: services
      additional_contexts: *bibliotheques
      args:
        SERVICE: pharmacie
    image: lafia/pharmacie

  citoyen:
    <<: *service-fhir
    build:
      context: services
      additional_contexts: *bibliotheques
      args:
        SERVICE: citoyen
    image: lafia/citoyen

  # Identite ne parle jamais FHIR : hors du réseau noyau, il ne peut pas le joindre. Il signe les jetons
  # de la clé privée JETON_CLE_PRIVEE ; vide, sur localhost seulement, il prend la clé de développement ;
  # sur tout autre domaine, il refuse de démarrer. Il lit ses comptes dans donnees/, construit dans son image.
  identite:
    build:
      context: services
      additional_contexts: *bibliotheques
      args:
        SERVICE: identite
        BIBLIOTHEQUES: commun donnees
    image: lafia/identite
    restart: unless-stopped
    depends_on:
      base-identite:
        condition: service_healthy
    environment:
      LAFIA_DOMAINE: ${LAFIA_DOMAINE:-localhost}
      JETON_CLE_PRIVEE: ${JETON_CLE_PRIVEE:-}
      BASE_URL: postgresql://identite@base-identite:5432/identite
      BASE_MOT_DE_PASSE: ${IDENTITE_BASE_MOT_DE_PASSE-identite-local}
    networks:
      - passerelle
      - identite
    mem_limit: 256m

  # Comptes, codes carnet, sessions et compteurs d'échecs d'identite : aucune donnée médicale.
  base-identite:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identite
      POSTGRES_USER: identite
      POSTGRES_PASSWORD: ${IDENTITE_BASE_MOT_DE_PASSE-identite-local}
    volumes:
      - identite-donnees:/var/lib/postgresql/data
    networks:
      - identite
    healthcheck:
      test: ["CMD", "pg_isready", "--username=identite", "--dbname=identite"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  # Chaque application est construite par web/Dockerfile, système de design et code commun compris.
  application-soin:
    <<: *application
    build:
      context: web
      args:
        APPLICATION: soin
    image: lafia/application-soin
    environment:
      PASSERELLE_URL: http://soin.${LAFIA_DOMAINE:-localhost}:8080

  application-caisse:
    <<: *application
    build:
      context: web
      args:
        APPLICATION: caisse
    image: lafia/application-caisse
    environment:
      PASSERELLE_URL: http://caisse.${LAFIA_DOMAINE:-localhost}:8080

  application-pharmacie:
    <<: *application
    build:
      context: web
      args:
        APPLICATION: pharmacie
    image: lafia/application-pharmacie
    environment:
      PASSERELLE_URL: http://pharmacie.${LAFIA_DOMAINE:-localhost}:8080

  application-citoyen:
    <<: *application
    build:
      context: web
      args:
        APPLICATION: citoyen
    image: lafia/application-citoyen
    environment:
      PASSERELLE_URL: http://citoyen.${LAFIA_DOMAINE:-localhost}:8080

  # Le site produit, sur le domaine lui-même. Il n'appelle aucun service : il ne reçoit que le domaine,
  # pour ses liens vers chaque application.
  application-site:
    <<: *application
    build:
      context: web
      args:
        APPLICATION: site
    image: lafia/application-site
    environment:
      LAFIA_DOMAINE: ${LAFIA_DOMAINE:-localhost}

networks:
  passerelle:
  noyau:
    internal: true
  identite:
    internal: true

volumes:
  passerelle-donnees:
  passerelle-config:
  noyau-donnees:
  identite-donnees:
