# Agents du jeu de démonstration : soignants, caissiers et pharmaciens. Personnes synthétiques.
#
# id      identifiant fixe du Practitioner dans le noyau ; c'est aussi le `sub` des jetons de l'agent.
#         Il ne dit rien de la personne : les journaux le citent.
# role    médecin, infirmier, caissier ou pharmacien.
# compte  un compte par établissement où l'agent travaille : un jeton ne porte qu'un établissement.
#         Identifiants et mots de passe publics, listés sur la page de connexion de chaque application.
#         `reserve_aux_tests` : compte que la suite verrouille exprès ; jamais listé.

