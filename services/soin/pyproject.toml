[project]
name = "lafia-soin"
version = "0.1.0"
description = "Service soin : cas de visite, visites, mesures, diagnostics, ordonnances."
requires-python = ">=3.11"
dependencies = [
    "lafia-commun",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.54,<0.55",
    "python-multipart>=0.0.32,<0.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soin"]
