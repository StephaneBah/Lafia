# Établissements du jeu de démonstration : où les visites ont lieu.
#
# Ce sont des structures publiques réelles, nommées pour que la démonstration soit reconnaissable et
# couvre la pyramide sanitaire, du centre national au centre de santé rural. Aucune personne, aucun
# compte ni aucun fait clinique réel ne s'y rattache : tout le reste du jeu est synthétique.
#
# id      identifiant fixe de l'Organization dans le noyau ; les comptes des agents le citent.
# niveau  chu-national, chu-departemental, chu-de-zone ou centre-de-sante : le prix de chaque produit
#         et acte en dépend (catalogue.toml).

