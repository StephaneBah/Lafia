[project]
name = "lafia-identite"
version = "0.1.0"
description = "Service identite : comptes des agents, rôles, établissement, codes carnet ; émission des jetons."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.54,<0.55",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identite"]
