[project]
name = "lafia-extraction"
version = "0.1.0"
description = "Service extraction : lit un Document et propose des faits, sans rien garder (ADR 0009). Aujourd'hui, l'Extraction de démonstration."
requires-python = ">=3.11"
dependencies = [
    "lafia-commun",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.54,<0.55",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction"]
