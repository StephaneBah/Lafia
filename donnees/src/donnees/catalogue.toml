# Catalogue du jeu de démonstration : les produits et actes qu'une ordonnance peut porter, et leur
# tarif en FCFA. La caisse lit le tarif : aucun montant n'est saisi.
#
# code     code du produit ou de l'acte dans le catalogue de Lafia : MED- pour un médicament, ACT- pour
#          un acte de soin, EXA- pour un examen.
# atc      pour un médicament, son code dans la classification ATC de l'OMS.
# prix     prix unitaire en FCFA à chaque niveau d'établissement (etablissements.toml) : chaque
#          établissement a ainsi un tarif pour chaque produit et chaque acte. Prix plausibles pour le
#          secteur public, sans valeur officielle.

