# Patients du jeu de démonstration. Personnes synthétiques, de plusieurs régions, âges et langues ;
# aucune donnée clinique : les cas, mesures, allergies et ordonnances arrivent avec les services qui
# en fixent la forme (F3 à F5).
#
# id                   identifiant fixe du Patient dans le noyau. Il ne dit rien de la personne.
# npi                  13 chiffres, commençant par six zéros : aucun NPI réel n'en commence ainsi.
# sexe                 féminin ou masculin.
# lieu_de_naissance    commune et pays (code ISO 3166 à deux lettres) ; nationalite, même code.
# adresse              département, commune, arrondissement, quartier ou village.
# langues              langues parlées, codes BCP 47, la plus usuelle d'abord : fr, fon, yo (yoruba, nago),
#                      guw (goun), bba (baatonum), ddn (dendi), ff (fulfulde), pil (yom), tbz (ditammari),
#                      gej (mina), ajg (adja), mxl (mahi), tfi (toffin), ee (ewe), ha (haoussa), en.
# telephone            facultatif. Tous commencent par +229 01 00, série qu'aucun opérateur n'attribue.
# personne_a_prevenir  facultative : nom, prénoms, relation au patient, téléphone.
# reserve_aux_tests    NPI que la suite verrouille, ou dont elle renouvelle le code carnet, exprès.

