[project]
name = "lafia-donnees"
version = "0.1.0"
description = "Jeu de démonstration de Lafia, écrit dans son vocabulaire, et son chargement dans le noyau."
requires-python = ">=3.11"
dependencies = [
    "lafia-commun",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/donnees"]
